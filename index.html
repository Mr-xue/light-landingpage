<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>光影背景 · Today.ai 复刻</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ACCDEC'/%3E%3Cstop offset='.6' stop-color='%23E7EBF4'/%3E%3Cstop offset='1' stop-color='%23FFDDB9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E" />
<style>
  /* ============================================================
     背景层结构（1:1 还原 today.ai/thanks）
     ① stage     静态渐变打底  #ACCDEC → #E7EBF4 → #FFDDB9
     ② video     白墙树影视频，object-fit: cover / object-position: center top
     ③ poster    视频海报图，视频就绪后淡出（crossfade）
     ④ tint      同款渐变 @52% 透明 + mix-blend-mode: color  ← 关键染色层
     ⑤ veil      白色 28% 薄纱，把整体压柔
     ⑥ content   正文
     ============================================================ */

  :root {
    --bg-base: linear-gradient(180deg, #ACCDEC 0%, #E7EBF4 61.54%, #FFDDB9 100%);
    --bg-tint: linear-gradient(180deg,
                rgba(172, 205, 236, 0.52) 0%,
                rgba(231, 235, 244, 0.52) 61.54%,
                rgba(255, 221, 185, 0.52) 100%);
    --bg-veil: rgba(255, 255, 255, 0.28);

    --text: rgba(0, 0, 0, 0.82);
    --text-soft: rgba(0, 0, 0, 0.56);
    --glass-bg: rgba(255, 255, 255, 0.42);
    --glass-bd: rgba(255, 255, 255, 0.62);
    --glass-sh: 0 6px 24px rgba(60, 80, 120, 0.14);

    --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ---------- 舞台 ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    overflow: hidden;
    background: var(--bg-base);          /* ① */
    isolation: isolate;
  }

  /* ---------- ② 背景视频 ---------- */
  .bg-video {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    pointer-events: none;
  }

  /* ---------- ③ 海报图（crossfade） ---------- */
  .bg-poster {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1000ms linear;
    will-change: opacity;
  }
  .bg-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  /* 视频开始播放 → 海报淡出 */
  .stage.is-ready .bg-poster { opacity: 0; }

  /* ---------- ④ 染色层 ---------- */
  .bg-tint {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: var(--bg-tint);
    mix-blend-mode: color;
  }

  /* ---------- ⑤ 白色薄纱 ---------- */
  .bg-veil {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: var(--bg-veil);
  }

  /* ---------- ⑥ 正文 ---------- */
  .content {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    gap: 0;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-soft);
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-bd);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
    box-shadow: var(--glass-sh);
    animation: rise 1.1s var(--ease-soft) both;
  }
  .eyebrow .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
  }

  h1 {
    margin: 28px 0 0;
    font-size: clamp(38px, 8.2vw, 84px);
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
    animation: rise 1.1s 0.1s var(--ease-soft) both;
  }

  .lede {
    margin: 22px 0 0;
    max-width: 30em;
    font-size: clamp(15px, 1.65vw, 18px);
    line-height: 1.75;
    color: var(--text-soft);
    text-wrap: pretty;
    animation: rise 1.1s 0.2s var(--ease-soft) both;
  }

  .actions {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    animation: rise 1.1s 0.3s var(--ease-soft) both;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 24px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
    background: var(--glass-bg);
    border: 1px solid var(--glass-bd);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    box-shadow: var(--glass-sh);
    transition: transform 0.35s var(--ease-soft), background 0.35s var(--ease-soft);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost {
    background: transparent;
    box-shadow: none;
    border-color: transparent;
    color: var(--text-soft);
  }
  .btn.ghost:hover { color: var(--text); }
  .btn svg { width: 15px; height: 15px; }
  .btn.ghost svg { width: 13px; height: 13px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 无障碍：尊重「减少动态效果」 ---------- */
  @media (prefers-reduced-motion: reduce) {
    .eyebrow, h1, .lede, .actions { animation: none; }
    .bg-poster { transition: none; }
    .bg-video { display: none; }
    /* 视频已被隐藏，海报必须留住，否则会露出空白渐变底
       （JS 仍会挂上 .is-ready，这里要覆盖掉淡出） */
    .stage.is-ready .bg-poster { opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- ② 背景视频（静音循环、自动播放） -->
  <video class="bg-video" id="bgVideo"
         autoplay loop muted playsinline preload="auto"
         poster="assets/bg-poster.jpg">
    <source src="assets/bg.webm" type="video/webm" />
    <source src="assets/bg.mp4" type="video/mp4" />
  </video>

  <!-- ③ 海报图：视频就绪后淡出 -->
  <div class="bg-poster">
    <img src="assets/bg-poster.jpg" alt="" aria-hidden="true" />
  </div>

  <!-- ④ 渐变染色层 -->
  <div class="bg-tint"></div>

  <!-- ⑤ 白色薄纱 -->
  <div class="bg-veil"></div>

  <!-- ⑥ 正文（文案随便换） -->
  <main class="content">
    <span class="eyebrow"><span class="dot"></span>光影背景</span>

    <h1>把光，留在墙上。</h1>

    <p class="lede">
      树影在白色墙面上缓缓流动，蓝到暖的渐变轻轻染过。
      安静、通透，像午后窗边的一段留白。
    </p>

    <div class="actions">
      <a class="btn ghost" href="assets/bg.mp4" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16" />
        </svg>
        下载背景视频
      </a>
    </div>
  </main>

</div>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var video = document.getElementById('bgVideo');
    if (!video) return;

    // 视频真正开始播放后再让海报图淡出，避免出现黑帧
    function markReady() { stage.classList.add('is-ready'); }

    video.addEventListener('playing', markReady, { once: true });
    video.addEventListener('loadeddata', function () {
      // 兜底：首帧已解码，允许淡出
      requestAnimationFrame(markReady);
    }, { once: true });

    // 某些浏览器需要显式触发一次播放
    var p = video.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () {
        // 自动播放被拦（如省电模式）：保留海报图，静默失败
        window.addEventListener('pointerdown', function once() {
          window.removeEventListener('pointerdown', once);
          video.play().catch(function () {});
        }, { once: true });
      });
    }

    // 标签页切回前台继续播放
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && video.paused) video.play().catch(function () {});
    });
  })();
</script>

</body>
</html>
